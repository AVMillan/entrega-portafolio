[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/yahoo/validate"
  to = "/.netlify/functions/validate"
  status = 200
  force = true

[[redirects]]
  from = "/api/yahoo"
  to = "/.netlify/functions/yahoo"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
